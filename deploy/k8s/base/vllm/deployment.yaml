apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: model-server
spec:
  replicas: 1
  # ReadWriteOnce cache volume (and, on GPU, one GPU): the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: model-server
    spec:
      # Kubernetes would inject VLLM_PORT=tcp://… for the "vllm" Service, which vLLM reads
      # as its own setting and crashes on.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # Placeholder; the CPU or GPU component sets the real image.
          image: vllm-server
          # Kubernetes expands $(VAR) in args from the container's env.
          # Components append device-specific flags to this list.
          args:
            - --model=$(LLM_MODEL)
            - --port=8000
            - --max-model-len=$(VLLM_MAX_MODEL_LEN)
            - --reasoning-parser=$(VLLM_REASONING_PARSER)
            - --enable-auto-tool-choice
            - --tool-call-parser=$(VLLM_TOOL_CALL_PARSER)
            - --generation-config=auto
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
          # First start downloads the model; allow up to 20 minutes before liveness applies.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: vllm-hf-cache
        # PyTorch needs more shared memory than the container default of 64 MB.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
