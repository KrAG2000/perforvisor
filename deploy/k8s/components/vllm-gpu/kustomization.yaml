apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# vLLM on one NVIDIA GPU.
images:
  - name: vllm-server
    newName: vllm/vllm-openai
    # Pinned nightly, same as docker-compose.yml: EmbeddingGemma 2 support landed after 0.31.0.
    newTag: nightly-77154ca6116ae34cbfe314beef1016bde9b63989
configMapGenerator:
  - name: vllm-config
    behavior: merge
    literals:
      # 60% of the L4: the embedding server time-shares the same GPU (15%).
      - VLLM_GPU_MEMORY_UTILIZATION=0.60
patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --gpu-memory-utilization=$(VLLM_GPU_MEMORY_UTILIZATION)
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 16Gi
            nvidia.com/gpu: "1"
