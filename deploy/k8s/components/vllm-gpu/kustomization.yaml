apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# vLLM on one NVIDIA GPU.
images:
  - name: vllm-server
    newName: vllm/vllm-openai
    newTag: v0.31.0
configMapGenerator:
  - name: vllm-config
    behavior: merge
    literals:
      - VLLM_GPU_MEMORY_UTILIZATION=0.90
patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --gpu-memory-utilization=$(VLLM_GPU_MEMORY_UTILIZATION)
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 16Gi
            nvidia.com/gpu: "1"
