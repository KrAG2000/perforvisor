apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Set here, not only in base: resources outside base (embed, exposure) need it too.
namespace: perforvisor
resources:
  - ../../base
components:
  - ../../components/vllm-cpu
configMapGenerator:
  - name: vllm-config
    behavior: merge
    literals:
      - VLLM_MAX_MODEL_LEN=8192
patches:
  - path: vllm-cpu-node.yaml
