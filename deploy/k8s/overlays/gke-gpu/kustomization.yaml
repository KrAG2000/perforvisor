apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Set here, not only in base: resources outside base (embed, exposure) need it too.
namespace: perforvisor
# Both model servers on one NVIDIA L4 (GKE GPU time-sharing), exposed over HTTPS with an
# API key so Vercel functions can call them. Setup: deploy/gke/README.md.
resources:
  - ../../base
  - ../../embed
  - exposure.yaml
components:
  - ../../components/vllm-gpu
configMapGenerator:
  # The L4 is shared: chat takes 60% of its 24 GB, embeddings 15% (see ../../embed).
  # Values set by a component win over the same keys here (components merge last).
  - name: vllm-config
    behavior: merge
    literals:
      - VLLM_MAX_MODEL_LEN=16384
  # Public hostnames; set by deploy/gke/README.md step 3 once the static IP exists.
  - name: llm-hosts
    literals:
      - CHAT_HOST=chat.136.81.123.68.sslip.io
      - EMBED_HOST=embed.136.81.123.68.sslip.io
patches:
  - path: gpu-node.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=model-server
  - path: api-key.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=model-server
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kv-cache-dtype=fp8
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --max-num-seqs=16
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/neg: '{"ingress": true}'
          cloud.google.com/backend-config: '{"default": "vllm-backend"}'
replacements:
  - source: { kind: ConfigMap, name: llm-hosts, fieldPath: data.CHAT_HOST }
    targets:
      - select: { kind: Ingress, name: vllm }
        fieldPaths: [spec.rules.0.host]
      - select: { kind: ManagedCertificate, name: vllm }
        fieldPaths: [spec.domains.0]
  - source: { kind: ConfigMap, name: llm-hosts, fieldPath: data.EMBED_HOST }
    targets:
      - select: { kind: Ingress, name: vllm }
        fieldPaths: [spec.rules.1.host]
      - select: { kind: ManagedCertificate, name: vllm }
        fieldPaths: [spec.domains.1]
