apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/vllm-gpu
configMapGenerator:
  # An L4 has 24 GB, so the small model gets a much longer context than on a laptop.
  # Note: values a component sets win over the same keys here (components merge last).
  - name: vllm-config
    behavior: merge
    literals:
      - VLLM_MAX_MODEL_LEN=32768
patches:
  - path: vllm-gpu-node.yaml
